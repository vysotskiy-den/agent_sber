[project]
name = "agent-sber"
version = "0.1.0"
description = "Иерархическая МАС для симуляции торговли акциями (GigaChat + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.2",
    "finnhub-python>=2.4.28",
    "langchain>=1.3.8",
    "langchain-community>=0.4.2",
    "langchain-gigachat>=0.5.1",
    "langgraph>=1.2.4",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
